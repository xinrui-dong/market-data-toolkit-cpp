name: Build, test, benchmark and docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

# New work on a ref replaces its older run; unrelated branches keep running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-checks:
    name: ${{ matrix.platform }} - CMake, CTest, benchmark and Doxygen
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: ubuntu
            generator: Unix Makefiles
          - os: macos-26
            platform: macos
            generator: Unix Makefiles
          - os: windows-2022
            platform: windows
            generator: Visual Studio 17 2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build and documentation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake doxygen g++ make python3

      - name: Install macOS documentation tools
        if: runner.os == 'macOS'
        run: brew install doxygen

      - name: Install Windows documentation tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install doxygen.install --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Doxygen installation failed" }
          "$env:ProgramFiles\doxygen\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show tool versions
        run: |
          cmake --version
          doxygen --version
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python --version
          else
            c++ --version
            python3 --version
          fi

      - name: Configure Release build
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel 2

      - name: Run unit tests
        if: runner.os != 'Windows'
        run: ctest --test-dir build -C Release --verbose --output-on-failure --no-tests=error

      - name: Run the complete Windows verification script
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CMAKE_GENERATOR: ${{ matrix.generator }}
        run: ./scripts/verify.ps1

      - name: Check the real EUR/USD example
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/check_market_example.py --app build/bin/market_data.exe --data-dir data
          else
            python3 scripts/check_market_example.py --app build/bin/market_data --data-dir data
          fi

      - name: Run benchmarks
        if: runner.os != 'Windows'
        run: |
          cmake --build build --config Release --target run_benchmarks
          test -s build/benchmark.json

      - name: Generate Doxygen documentation
        if: runner.os != 'Windows'
        run: |
          cmake --build build --config Release --target docs
          test -s build/docs/html/index.html

      - name: Save benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ matrix.platform }}
          path: build/benchmark.json
          if-no-files-found: error
          retention-days: 14

      - name: Save HTML documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doxygen-html-${{ matrix.platform }}
          path: build/docs/html
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: >-
          matrix.platform == 'ubuntu' &&
          vars.ENABLE_PAGES == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/html

  deploy-pages:
    name: Publish Doxygen to GitHub Pages
    needs: build-checks
    if: >-
      vars.ENABLE_PAGES == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
